[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/partilhar/:id"
  to = "/.netlify/functions/partilhar?id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/imagem-partilha/:id"
  to = "/.netlify/functions/imagem-partilha?id=:id"
  status = 200
  force = true
